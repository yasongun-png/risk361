<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Eczane Reçete SUD Kontrol ve Raporlama Uygulaması</title>

<!-- Harici kütüphaneler: yalnızca OCR / PDF / Word / Excel üretimi için kullanılır.
     Tüm veriler (reçete, ilaç, kural) tarayıcıda IndexedDB içinde kalır; hiçbir
     hasta verisi veya reçete görseli dış sunuculara gönderilmez. -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>

<style>
:root{
  --navy:#0f2744; --navy-2:#16324f; --navy-3:#1c3f63;
  --accent:#2563eb; --accent-2:#1d4ed8;
  --bg:#f4f6f9; --card:#ffffff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b;
  --ok:#15803d; --ok-bg:#dcfce7; --ok-bd:#86efac;
  --warn:#a16207; --warn-bg:#fef9c3; --warn-bd:#fde047;
  --bad:#b91c1c; --bad-bg:#fee2e2; --bad-bd:#fca5a5;
  --none:#475569; --none-bg:#e2e8f0; --none-bd:#cbd5e1;
  --radius:10px;
  --sidebar-w:250px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px;}

button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:linear-gradient(180deg,var(--navy),var(--navy-2));
  color:#e2e8f0; display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:40;
  transition:transform .2s ease;
}
#sidebar .brand{padding:20px 18px 14px; border-bottom:1px solid rgba(255,255,255,.1);}
#sidebar .brand h1{font-size:15px;margin:0 0 2px;color:#fff;font-weight:700;}
#sidebar .brand span{font-size:11px;color:#93c5fd;}
#nav{flex:1;overflow-y:auto;padding:10px 0;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 18px;color:#cbd5e1;text-decoration:none;
  font-size:13.5px;cursor:pointer;border-left:3px solid transparent;white-space:nowrap;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(37,99,235,.25);color:#fff;border-left-color:var(--accent);font-weight:600;}
.nav-item .ic{font-size:16px;width:20px;text-align:center;}
.nav-badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:1px 7px;font-weight:700;}
#sidebar .foot{padding:12px 18px;font-size:10.5px;color:#8ba3c7;border-top:1px solid rgba(255,255,255,.1);}

#main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{
  height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;
  padding:0 20px;gap:14px;position:sticky;top:0;z-index:30;
}
#menuToggle{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:16px;}
#topbar h2{font-size:16px;margin:0;font-weight:700;color:var(--navy);}
#topbar .disclaimer{margin-left:auto;font-size:11px;color:var(--muted);max-width:440px;text-align:right;}
#content{padding:22px;flex:1;}

.overlay-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:39;}
.overlay-bg.show{display:block;}

/* ---------- generic components ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.card h3{margin:0 0 12px;font-size:14.5px;color:var(--navy);font-weight:700;}
.grid{display:grid;gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;}
.stat .n{font-size:26px;font-weight:800;color:var(--navy);}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
.stat.accent-ok{border-left:4px solid var(--ok);}
.stat.accent-warn{border-left:4px solid var(--warn);}
.stat.accent-bad{border-left:4px solid var(--bad);}
.stat.accent-blue{border-left:4px solid var(--accent);}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;color:var(--text);
  padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;}
.btn:hover{background:#f1f5f9;}
.btn.primary{background:var(--accent);border-color:var(--accent-2);color:#fff;}
.btn.primary:hover{background:var(--accent-2);}
.btn.danger{background:#fff;border-color:var(--bad-bd);color:var(--bad);}
.btn.danger:hover{background:var(--bad-bg);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid;}
.badge.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd);}
.badge.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd);}
.badge.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-bd);}
.badge.none{color:var(--none);background:var(--none-bg);border-color:var(--none-bd);}
.badge.demo{color:#7c3aed;background:#ede9fe;border-color:#c4b5fd;}
.badge.manual{color:#0369a1;background:#e0f2fe;border-color:#7dd3fc;}
.badge.info{color:#334155;background:#f1f5f9;border-color:#cbd5e1;}

table{width:100%;border-collapse:collapse;font-size:13px;}
table th{text-align:left;background:#f8fafc;color:var(--navy);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--border);white-space:nowrap;}
table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
table tr:hover td{background:#f8fafc;}
.table-wrap{overflow-x:auto;}

label.field{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--accent);}
.formrow{margin-bottom:12px;}
.inline-edited{border-color:#7dd3fc!important;background:#f0f9ff;}

.banner{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;border:1px solid;display:flex;gap:10px;align-items:flex-start;}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:#78350f;}
.banner.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a;}
.banner.bad{background:var(--bad-bg);border-color:var(--bad-bd);color:#7f1d1d;}
.banner .x{margin-left:auto;cursor:pointer;font-weight:700;}

.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:#0f2744;color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:340px;animation:in .2s ease;}
.toast.err{background:#7f1d1d;}
.toast.ok{background:#14532d;}
@keyframes in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.5);padding:20px;}
.modal.show{display:flex;}
.modal .box{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px;}
.modal .box h3{margin-top:0;}

.step-bar{display:flex;gap:6px;margin-bottom:18px;}
.step-bar .s{flex:1;text-align:center;padding:9px 4px;background:#e2e8f0;color:#64748b;border-radius:7px;font-size:12px;font-weight:700;}
.step-bar .s.active{background:var(--accent);color:#fff;}
.step-bar .s.done{background:var(--ok);color:#fff;}

.dropzone{border:2px dashed #94a3b8;border-radius:12px;padding:46px 20px;text-align:center;color:var(--muted);background:#f8fafc;cursor:pointer;transition:.15s;}
.dropzone.drag{border-color:var(--accent);background:#eff6ff;color:var(--accent-2);}
.dropzone .big{font-size:40px;margin-bottom:8px;}

.editor-layout{display:flex;gap:16px;flex-wrap:wrap;}
.editor-canvas-wrap{flex:1 1 480px;min-width:320px;border:1px solid var(--border);border-radius:10px;background:#111827;overflow:auto;max-height:70vh;position:relative;text-align:center;padding:10px;}
.editor-canvas-wrap canvas{max-width:100%;background:#fff;}
.editor-tools{flex:0 0 240px;display:flex;flex-direction:column;gap:8px;}
.editor-tools .grp{border:1px solid var(--border);border-radius:8px;padding:10px;}
.editor-tools .grp h4{margin:0 0 8px;font-size:12px;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;}
.editor-tools .row{display:flex;gap:6px;flex-wrap:wrap;}

#cropOverlay{position:absolute;border:2px dashed #fbbf24;background:rgba(251,191,36,.15);display:none;}

.med-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff;}
.med-card .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap;}
.med-card .mhead .name{font-weight:700;color:var(--navy);font-size:14.5px;}
.checklist{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;}
.checklist li{padding:4px 0;display:flex;gap:8px;align-items:flex-start;border-top:1px dashed var(--border);}
.checklist li:first-child{border-top:none;}
.checklist .ic{width:16px;flex:0 0 16px;text-align:center;}

.progress-bar{height:8px;background:#e2e8f0;border-radius:5px;overflow:hidden;margin:8px 0;}
.progress-bar > div{height:100%;background:var(--accent);transition:width .2s;}

.chip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;background:#f1f5f9;color:#475569;margin:2px 3px 2px 0;border:1px solid var(--border);}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:14px;flex-wrap:wrap;}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;}
.tab.active{color:var(--accent-2);border-color:var(--accent);}

.mask-toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.small{font-size:12px;color:var(--muted);}
.hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
.flex{display:flex;gap:10px;align-items:center;}
.flex.wrap{flex-wrap:wrap;}
.spacer{flex:1;}
.right{text-align:right;}
.center{text-align:center;}
a.link{color:var(--accent-2);text-decoration:none;cursor:pointer;font-weight:600;}
a.link:hover{text-decoration:underline;}

.print-report{background:#fff;padding:26px;max-width:800px;margin:0 auto;border:1px solid var(--border);border-radius:10px;font-size:13px;}
.print-report h1{font-size:18px;color:var(--navy);margin:0 0 2px;}
.print-report h2{font-size:14px;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:4px;margin:22px 0 10px;}
.print-report table{margin-bottom:10px;}
.pr-head{display:flex;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:14px;}
.pr-head .meta{text-align:right;font-size:12px;color:var(--muted);}

@media(max-width:900px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #menuToggle{display:inline-block;}
  #topbar .disclaimer{display:none;}
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1>Eczane SUD Kontrol</h1>
      <span>Reçete Kontrol &amp; Raporlama · Yerel</span>
    </div>
    <nav id="nav"></nav>
    <div class="foot">Yalnızca yardımcı kontrol aracıdır.<br>Nihai karar eczacı/hekim sorumluluğundadır.</div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button id="menuToggle">☰</button>
      <h2 id="pageTitle">Dashboard</h2>
      <div class="disclaimer">Bu sistem yalnızca tanımlanmış SUD kurallarına göre otomatik ön kontrol yapar; tıbbi karar veya mevzuat yorumu üretmez.</div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="overlay-bg" id="overlayBg"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
/* =========================================================================
   0. SABİTLER / YARDIMCI FONKSİYONLAR
   ========================================================================= */
const NAV_ITEMS = [
  {id:'dashboard', ic:'🏠', label:'Dashboard'},
  {id:'upload',    ic:'📷', label:'Reçete Yükle'},
  {id:'control',   ic:'🔍', label:'Reçete Kontrol'},
  {id:'meds',      ic:'💊', label:'İlaç Veritabanı'},
  {id:'rules',     ic:'📋', label:'SUD Kuralları'},
  {id:'violations',ic:'⚠️', label:'Uygunsuzluklar'},
  {id:'reports',   ic:'📊', label:'Raporlar'},
  {id:'archive',   ic:'🗂️', label:'Reçete Arşivi'},
  {id:'settings',  ic:'⚙️', label:'Ayarlar'},
  {id:'backup',    ic:'💾', label:'Yedekleme'},
];

const STATUS = {
  OK:   {key:'OK',   label:'UYGUN',            icon:'🟢', cls:'ok'},
  WARN: {key:'WARN', label:'UYARI',            icon:'🟡', cls:'warn'},
  BAD:  {key:'BAD',  label:'UYGUNSUZ',         icon:'🔴', cls:'bad'},
  NA:   {key:'NA',   label:'KONTROL EDİLEMEDİ',icon:'⚪', cls:'none'},
};
// UYGUNSUZ > UYARI > KONTROL EDİLEMEDİ > UYGUN (en kötü durum kazanır)
const STATUS_PRIORITY = ['BAD','WARN','NA','OK'];

function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0, v=c=='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}
function nowIso(){return new Date().toISOString();}
function fmtDate(iso){
  if(!iso) return '—';
  const d = typeof iso==='string' ? new Date(iso) : iso;
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('tr-TR');
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('tr-TR')+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normTr(s){
  if(!s) return '';
  return String(s).toLocaleLowerCase('tr-TR')
    .replace(/ı/g,'i').replace(/İ/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u')
    .replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/[^a-z0-9]+/g,' ').trim();
}
function maskName(v){
  if(!v) return '';
  return v.split(' ').map(p=> p.length<=1 ? p : p[0]+'*'.repeat(p.length-1)).join(' ');
}
function maskTckn(v){
  if(!v) return '';
  const s = String(v);
  if(s.length<5) return '*'.repeat(s.length);
  return s.slice(0,3)+'*'.repeat(s.length-5)+s.slice(-2);
}
function toast(msg,type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast'+(type?(' '+type):'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);}, 3600);
}
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function confirmDialog(msg, onYes, opts){
  opts = opts||{};
  openModal(`
    <h3>${escapeHtml(opts.title||'Onay')}</h3>
    <p>${escapeHtml(msg)}</p>
    <div class="flex right"><button class="btn" onclick="closeModal()">Vazgeç</button>
    <button class="btn ${opts.danger?'danger':'primary'}" id="confirmYesBtn">${escapeHtml(opts.yesLabel||'Onayla')}</button></div>
  `);
  document.getElementById('confirmYesBtn').onclick = ()=>{closeModal(); onYes();};
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function blobToDataUrl(blob){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function dataUrlToBlob(dataUrl){
  return fetch(dataUrl).then(r=>r.blob());
}
// Belirsiz OCR karakter/ifade kalıpları (0/O, 1/I, 5/S, mg/mcg, 1x1/1x2, 10/100 vb.)
const AMBIGUOUS_PATTERNS = [
  {re:/\b[0O]{1}\d|\d[0O]\b/i, label:'0 / O karışıklığı olabilir'},
  {re:/\b[1I]\d|\d[1I]\b/i, label:'1 / I karışıklığı olabilir'},
  {re:/\b[5S]\d|\d[5S]\b/i, label:'5 / S karışıklığı olabilir'},
  {re:/mcg|mg/i, label:'mg / mcg karışıklığı olabilir'},
  {re:/\d\s*[xX]\s*\d/, label:'kullanım sıklığı (ör. 1x1 / 1x2) karışıklığı olabilir'},
  {re:/\b10\b|\b100\b/, label:'10 / 100 karışıklığı olabilir'},
];
function findAmbiguities(text){
  if(!text) return [];
  const hits = [];
  AMBIGUOUS_PATTERNS.forEach(p=>{ if(p.re.test(text)) hits.push(p.label); });
  return hits;
}

/* =========================================================================
   1. INDEXEDDB KATMANI
   ========================================================================= */
const DB_NAME='eczane_sud_db', DB_VERSION=1;
const STORES=['prescriptions','images','medications','sudRules','settings'];
let _dbp = null;
function openDb(){
  if(_dbp) return _dbp;
  _dbp = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('prescriptions')) db.createObjectStore('prescriptions',{keyPath:'id'});
      if(!db.objectStoreNames.contains('images')) db.createObjectStore('images',{keyPath:'id'});
      if(!db.objectStoreNames.contains('medications')) db.createObjectStore('medications',{keyPath:'id'});
      if(!db.objectStoreNames.contains('sudRules')) db.createObjectStore('sudRules',{keyPath:'id'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'key'});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _dbp;
}
async function dbTx(store, mode){
  const db = await openDb();
  return db.transaction(store, mode).objectStore(store);
}
async function dbPut(store, obj){
  const db = await openDb();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = ()=>res(obj);
    tx.onerror = ()=>rej(tx.error);
  });
}
async function dbGet(store, key){
  const os = await dbTx(store,'readonly');
  return new Promise((res,rej)=>{
    const r = os.get(key);
    r.onsuccess = ()=>res(r.result||null);
    r.onerror = ()=>rej(r.error);
  });
}
async function dbGetAll(store){
  const os = await dbTx(store,'readonly');
  return new Promise((res,rej)=>{
    const r = os.getAll();
    r.onsuccess = ()=>res(r.result||[]);
    r.onerror = ()=>rej(r.error);
  });
}
async function dbDelete(store, key){
  const db = await openDb();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = ()=>res();
    tx.onerror = ()=>rej(tx.error);
  });
}
async function dbClear(store){
  const db = await openDb();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = ()=>res();
    tx.onerror = ()=>rej(tx.error);
  });
}

  const s = await dbGet('settings','app');

async function viewDashboard(content){
  const prescriptions = await dbGetAll('prescriptions');

  const medWarnCount={}, ruleBadCount={};
  prescriptions.forEach(p=>{
    if(!p.sonuclar) return;
    const g = p.sonuclar.genelSonuc;
    if(g==='OK') uygun++; else kontrolGerekli++;

      <div class="stat accent-blue"><div class="n">${prescriptions.length}</div><div class="l">Toplam Reçete</div></div>
      <div class="stat accent-blue"><div class="n">${thisMonth.length}</div><div class="l">Bu Ay Kontrol Edilen</div></div>
      <div class="stat accent-ok"><div class="n">${uygun}</div><div class="l">Uygun Reçete</div></div>
      <div class="stat accent-bad"><div class="n">${kontrolGerekli}</div><div class="l">Kontrol Gerektiren</div></div>
    </div>
    <div class="grid cols-2" style="margin-top:14px">
      <div class="card">
        <h3>Reçete Durum Dağılımı</h3>
        <canvas id="statusChart" height="180"></canvas>
      </div>
      <div class="card">
        <h3>Uygunsuzluk Sayısı: <span style="color:var(--bad)">${uygunsuzlukSayisi}</span></h3>
        <p class="small">Tüm arşivdeki reçetelerde tespit edilen 🔴 UYGUNSUZ ilaç kontrol sayısıdır.</p>
        <a class="btn danger sm" href="#violations">Uygunsuzlukları Görüntüle →</a>
      </div>
    </div>
    <div class="grid cols-2">
      <div class="card">
        <h3>En Fazla Uyarı Veren İlaçlar</h3>
        ${topMeds.length? topMeds.map(([n,c])=>barRow(n,c,Math.max(...topMeds.map(x=>x[1])),'var(--warn)')).join('') : '<p class="small">Henüz veri yok.</p>'}
      </div>
      <div class="card">
        <h3>En Fazla Uygunsuzluk Veren Kurallar</h3>
        ${topRules.length? topRules.map(([n,c])=>barRow(n,c,Math.max(...topRules.map(x=>x[1])),'var(--bad)')).join('') : '<p class="small">Henüz veri yok.</p>'}
      </div>
    </div>
    <div class="card">
      <h3>Hızlı İşlemler</h3>
      <div class="flex wrap">
        <a class="btn primary" href="#upload">📷 Yeni Reçete Yükle</a>
        <a class="btn" href="#meds">💊 İlaç Veritabanını Yönet</a>
        <a class="btn" href="#rules">📋 SUD Kurallarını Yönet</a>
        <a class="btn" href="#archive">🗂️ Arşivi Görüntüle</a>
      </div>
    </div>
  `;
  drawStatusChart('statusChart', {OK:uygun, WARN:uyari, BAD:uygunsuzlukSayisi, NA:0});
}
function barRow(label,count,max,color){
  const pct = max? Math.round(count/max*100) : 0;
  return `<div style="margin-bottom:8px">
    <div class="flex" style="justify-content:space-between;font-size:12px;margin-bottom:2px">
      <span>${escapeHtml(label)}</span><b>${count}</b>
    </div>
    <div style="background:#e2e8f0;border-radius:5px;height:8px;overflow:hidden">
      <div style="width:${pct}%;height:100%;background:${color}"></div>
    </div>
  </div>`;
}
function drawStatusChart(canvasId, counts){
  const cv = document.getElementById(canvasId);
  if(!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth||360, h = 180;
  cv.width = w*dpr; cv.height=h*dpr; ctx.scale(dpr,dpr);
  const data = [
    {label:'Uygun', v:counts.OK, color:'#15803d'},
    {label:'Uyarı', v:counts.WARN, color:'#a16207'},
    {label:'Uygunsuz', v:counts.BAD, color:'#b91c1c'},
    {label:'Kontrol Edilemedi', v:counts.NA, color:'#475569'},
  ];
  const max = Math.max(1, ...data.map(d=>d.v));
  const barW = 56, gap = 30, baseY = h-30, top=16;
  ctx.clearRect(0,0,w,h);
  ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#334155';
  data.forEach((d,i)=>{
    const x = 30 + i*(barW+gap);
    const barH = (h-30-top) * (d.v/max);
    ctx.fillStyle = d.color;
    ctx.fillRect(x, baseY-barH, barW, Math.max(barH,d.v>0?2:0));
    ctx.fillStyle = '#334155';
    ctx.fillText(String(d.v), x+barW/2, baseY-barH-6);
    ctx.fillText(d.label, x+barW/2, h-10);
  });
}

    d.imageMeta = {rotation:editorState.rotation, zoom:editorState.zoom, grayscale:editorState.grayscale, contrast:editorState.contrast};
    d.editedDataUrl = canvas.toDataURL('image/png');
    d.step = 2;
    renderWizardStep(document.getElementById('content'));
  };
}
function drawEditor(){
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  const {img, rotation, zoom, grayscale, contrast} = editorState;
  const rad = rotation*Math.PI/180;
  const swap = rotation%180!==0;
  const baseW = img.width, baseH = img.height;
  const outW = (swap?baseH:baseW)*zoom, outH=(swap?baseW:baseH)*zoom;
  canvas.width = outW; canvas.height = outH;
  ctx.save();
  ctx.translate(outW/2, outH/2);
  ctx.rotate(rad);
  ctx.scale(zoom,zoom);
  ctx.drawImage(img, -baseW/2, -baseH/2);
  ctx.restore();
  if(grayscale || contrast!==0){
    const imgData = ctx.getImageData(0,0,outW,outH);
    const data = imgData.data;
    const c = (contrast/100)+1;
    const intercept = 128*(1-c);
    for(let i=0;i<data.length;i+=4){
      let r=data[i], g=data[i+1], b=data[i+2];
      if(grayscale){ const v=0.299*r+0.587*g+0.114*b; r=g=b=v; }
      r = r*c+intercept; g=g*c+intercept; b=b*c+intercept;
      data[i]=clamp255(r); data[i+1]=clamp255(g); data[i+2]=clamp255(b);
    }
    ctx.putImageData(imgData,0,0);
  }
}
function clamp255(v){return Math.max(0,Math.min(255,v));}
function applySharpen(canvas, ctx){
  const w=canvas.width, h=canvas.height;
  const src = ctx.getImageData(0,0,w,h);
  const dst = ctx.createImageData(w,h);
  const kernel = [0,-1,0, -1,5,-1, 0,-1,0];
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const idx = (y*w+x)*4;
      if(x===0||y===0||x===w-1||y===h-1){
        for(let k=0;k<4;k++) dst.data[idx+k]=src.data[idx+k];
        continue;
      }
      for(let c=0;c<3;c++){
        let sum=0, ki=0;
        for(let ky=-1;ky<=1;ky++) for(let kx=-1;kx<=1;kx++){
          const sidx = ((y+ky)*w+(x+kx))*4+c;
          sum += src.data[sidx]*kernel[ki++];
        }
        dst.data[idx+c] = clamp255(sum);
      }
      dst.data[idx+3]=src.data[idx+3];
    }
  }
  ctx.putImageData(dst,0,0);
}
function setupCropHandlers(){
  const wrap = document.getElementById('canvasWrap');
  const overlay = document.getElementById('cropOverlay');
  if(!editorState.cropMode){ overlay.style.display='none'; wrap.onmousedown=null; return; }
  let startX,startY,dragging=false;
  wrap.onmousedown = (e)=>{
    const rect = wrap.getBoundingClientRect();
    startX = e.clientX-rect.left+wrap.scrollLeft; startY = e.clientY-rect.top+wrap.scrollTop;
    dragging = true; overlay.style.display='block';
    overlay.style.left=startX+'px'; overlay.style.top=startY+'px'; overlay.style.width='0px'; overlay.style.height='0px';
  };
  wrap.onmousemove = (e)=>{
    if(!dragging) return;
    const rect = wrap.getBoundingClientRect();
    const x = e.clientX-rect.left+wrap.scrollLeft, y = e.clientY-rect.top+wrap.scrollTop;
    overlay.style.left = Math.min(x,startX)+'px'; overlay.style.top = Math.min(y,startY)+'px';
    overlay.style.width = Math.abs(x-startX)+'px'; overlay.style.height = Math.abs(y-startY)+'px';
  };
  window.addEventListener('mouseup', ()=>{dragging=false;});
}
function applyCrop(){
  const overlay = document.getElementById('cropOverlay');
  const canvas = document.getElementById('editCanvas');
  if(overlay.style.display!=='block' || !overlay.style.width || parseFloat(overlay.style.width)<5){
    toast('Önce "Kırpma Alanı Seç" ile bir alan belirleyin.','err'); return;
  }
  const wrap = document.getElementById('canvasWrap');
  const canvasRect = canvas.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const scaleX = canvas.width / canvas.clientWidth;
  const scaleY = canvas.height / canvas.clientHeight;
  const offX = canvasRect.left - wrapRect.left + wrap.scrollLeft;
  const offY = canvasRect.top - wrapRect.top + wrap.scrollTop;
  const ox = (parseFloat(overlay.style.left)-offX) * scaleX;
  const oy = (parseFloat(overlay.style.top)-offY) * scaleY;
  const ow = parseFloat(overlay.style.width) * scaleX;
  const oh = parseFloat(overlay.style.height) * scaleY;
  const ctx = canvas.getContext('2d');
  const cropped = ctx.getImageData(Math.max(0,ox),Math.max(0,oy),ow,oh);
  canvas.width = ow; canvas.height = oh;
  ctx.putImageData(cropped,0,0);
  // düzenleyici temel görüntüyü de güncelle ki döndürme/yakınlaştırma bundan sonra bu görüntü üzerinden çalışsın
  const newImg = new Image();
  newImg.onload = ()=>{ editorState.img=newImg; editorState.rotation=0; editorState.zoom=1; };
  newImg.src = canvas.toDataURL('image/png');
  overlay.style.display='none';
  editorState.cropMode=false;
  toast('Kırpma uygulandı.');
}

async function runOcr(){
  const d = App.draft;
  const statusEl = document.getElementById('ocrStatus');
  const progEl = document.getElementById('ocrProgress');
  const btn = document.getElementById('runOcrBtn');
  btn.disabled = true;
  try{
    statusEl.textContent = 'OCR motoru başlatılıyor…';
    const worker = await Tesseract.createWorker('tur', 1, {
      logger: m=>{
        if(m.status) statusEl.textContent = m.status+(m.progress? ' ('+Math.round(m.progress*100)+'%)':'');
        if(typeof m.progress==='number') progEl.style.width = Math.round(m.progress*100)+'%';
      }
    });
    const result = await worker.recognize(d.editedDataUrl||d.imageDataUrl);
    await worker.terminate();
    d.ocrRawText = result.data.text || '';
    d.ocrConfidence = result.data.confidence ?? null;
    d.ocrWords = (result.data.words||[]).map(w=>({text:w.text, confidence:w.confidence, bbox:w.bbox}));
    statusEl.textContent = 'OCR tamamlandı. Güven skoru: '+ (d.ocrConfidence!=null? d.ocrConfidence.toFixed(1)+'%':'—');
    document.getElementById('ocrResultWrap').style.display='block';

    } else {

/* ---- OCR metin ayrıştırma (heuristik, tahmini alanlar; kural/ilaç bilgisi UYDURMAZ) ---- */
function parseOcrText(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out = {hasta:{}, recete:{}, ilaclar:[]};
  const tcknMatch = text.match(/\b\d{11}\b/);
  if(tcknMatch) out.hasta.tckn = tcknMatch[0];
  const dateMatches = text.match(/\b\d{1,2}[./]\d{1,2}[./]\d{2,4}\b/g) || [];
  if(dateMatches[0]) out.recete.tarih = normalizeDateStr(dateMatches[0]);
  if(dateMatches[1]) out.hasta.dogumTarihi = normalizeDateStr(dateMatches[1]);
  const receteNoMatch = text.match(/re[cç]ete\s*no\s*[:.\-]?\s*([A-Za-z0-9\-]+)/i);
  if(receteNoMatch) out.recete.no = receteNoMatch[1];
  const doktorMatch = text.match(/dr\.?\s*([A-ZÇĞİÖŞÜ][a-zçğıöşü]+\s+[A-ZÇĞİÖŞÜ][a-zçğıöşü]+)/);
  if(doktorMatch) out.recete.doktorAdi = doktorMatch[1];
  const kurumMatch = text.match(/(hastane|poliklinik|sağlık\s*merkezi|aile\s*sağlığı)[^\n]*/i);
  if(kurumMatch) out.recete.kurum = kurumMatch[0].trim();

  // ilaç satırlarını yakala: mg/mcg/ml içeren ve varsa xN kullanım deseni olan satırlar
  const drugLineRe = /([A-ZÇĞİÖŞÜ][A-Za-zÇĞİÖŞÜçğıöşü0-9\-\/ ]{2,40}?)\s*(\d+[.,]?\d*)\s*(mg|mcg|ml|g)\b/i;
  const freqRe = /(\d+)\s*[xX]\s*(\d+)/;
  const boxRe = /(\d+)\s*(kutu|adet|kt)\b/i;
  lines.forEach(line=>{
    const dm = line.match(drugLineRe);
    if(!dm) return;
    const freqM = line.match(freqRe);
    const boxM = line.match(boxRe);
    out.ilaclar.push({
      ilacAdi: dm[1].trim(),
      doz: dm[2]+' '+dm[3],
      kullanimSikligi: freqM? (freqM[1]+'x'+freqM[2]) : '',
      kutuAdedi: boxM? boxM[1] : '',
      aciklama: line,
      rawLine: line,
    });
  });
  return out;
}
function normalizeDateStr(s){
  const m = s.match(/(\d{1,2})[./](\d{1,2})[./](\d{2,4})/);
  if(!m) return '';
  let [_,dd,mm,yy] = m;
  if(yy.length===2) yy = '20'+yy;
  return `${yy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
}
function applyParsedToDraft(parsed){
  const d = App.draft;
  d.hasta = {...d.hasta, ...parsed.hasta};
  d.recete = {...d.recete, ...parsed.recete};
  if(parsed.ilaclar.length){
    d.ilaclar = parsed.ilaclar.map(p=>({
      id:uuid(), ilacAdi:p.ilacAdi||'', etkenMadde:'', barkod:'', ambalajMiktari:'',
      doz:p.doz||'', kullanimSikligi:p.kullanimSikligi||'', kullanimSuresiGun:'',
      gunlukDoz:'', kutuAdedi:p.kutuAdedi||'', farmasotikForm:'', aciklama:p.aciklama||'',
      rawLine:p.rawLine||'',
    }));
  }
  if(d.ilaclar.length===0){
    d.ilaclar.push(blankIlacRow());
  }
}
function blankIlacRow(){
  return {id:uuid(), ilacAdi:'', etkenMadde:'', barkod:'', ambalajMiktari:'', doz:'', kullanimSikligi:'',
    kullanimSuresiGun:'', gunlukDoz:'', kutuAdedi:'', farmasotikForm:'', aciklama:'', rawLine:''};

/* =========================================================================
   6. SUD KURAL MOTORU
   ========================================================================= */
function findMedicationMatch(ilac){
  const nName = normTr(ilac.ilacAdi);
  const nEtken = normTr(ilac.etkenMadde);
  let match = null;
  if(ilac.barkod){
    match = App.medications.find(m=>m.barkod && m.barkod===ilac.barkod);
  }
  if(!match && nName){
    match = App.medications.find(m=> normTr(m.ilacAdi)===nName );
    if(!match) match = App.medications.find(m=> normTr(m.ilacAdi).includes(nName) || nName.includes(normTr(m.ilacAdi)) );
  }
  if(!match && nEtken){
    match = App.medications.find(m=> normTr(m.etkenMadde)===nEtken );
  }
  return match;
}
function findApplicableRules(medMatch, ilac, receteTarihi){
  if(!medMatch) return [];
  const nName = normTr(medMatch.ilacAdi);
  const dateOk = (r)=>{
    if(!receteTarihi) return true; // tarih yoksa filtreleme yapılamaz; kural yine de aday sayılır (KONTROL EDİLEMEDİ tarihte belirtilecek)
    const rd = new Date(receteTarihi);
    const from = r.gecerlilikBaslangic? new Date(r.gecerlilikBaslangic): null;
    const to = r.gecerlilikBitis? new Date(r.gecerlilikBitis): null;
    if(from && rd<from) return false;
    if(to && rd>to) return false;
    return true;
  };
  return App.sudRules.filter(r=> r.aktif!==false && dateOk(r) && (
    normTr(r.ilacAdi)===nName || (r.etkenMadde && normTr(r.etkenMadde)===normTr(medMatch.etkenMadde))
  ));
}
function evalRuleForIlac(rule, ilac, medMatch){
  const checks = [];
  const kutu = parseFloat(ilac.kutuAdedi);
  const sure = parseFloat(ilac.kullanimSuresiGun);
  const gunlukDoz = parseFloat(ilac.gunlukDoz);

  // İlaç eşleşmesi
  checks.push({label:'İlaç eşleşmesi', status:'OK', detail:medMatch.ilacAdi, kuralAdi:rule.kuralAdi});
  // Etken madde eşleşmesi
  if(ilac.etkenMadde){
    const ok = normTr(ilac.etkenMadde)===normTr(medMatch.etkenMadde);
    checks.push({label:'Etken madde eşleşmesi', status: ok?'OK':'WARN',
      detail: ok? medMatch.etkenMadde : `Reçete: ${ilac.etkenMadde} / Veritabanı: ${medMatch.etkenMadde}`, kuralAdi:rule.kuralAdi});
  } else {
    checks.push({label:'Etken madde eşleşmesi', status:'NA', detail:'Reçetede etken madde bilgisi girilmedi', kuralAdi:rule.kuralAdi});
  }
  // Kutu sayısı kontrolü
  if(rule.izinVerilenKutuSayisi!=null && rule.izinVerilenKutuSayisi!==''){
    if(isNaN(kutu)){
      checks.push({label:'Kutu miktarı kontrolü', status:'NA', detail:'Reçetede kutu adedi okunamadı/girilmedi', kuralAdi:rule.kuralAdi});
    } else {
      const limit = Number(rule.izinVerilenKutuSayisi);
      checks.push({label:'Kutu miktarı kontrolü', status: kutu<=limit?'OK':'BAD',
        detail:`Reçete: ${kutu} kutu / İzin verilen: ${limit} kutu`, kuralAdi:rule.kuralAdi,
        recValue:kutu, sudValue:limit, param:'kutuSayisi'});
    }
  } else {
    checks.push({label:'Kutu miktarı kontrolü', status:'NA', detail:'Bu kural için kutu sınırı tanımlanmamış', kuralAdi:rule.kuralAdi});
  }
  // Süre kontrolü
  if((rule.izinVerilenSureMinGun!=null && rule.izinVerilenSureMinGun!=='') || (rule.izinVerilenSureMaxGun!=null && rule.izinVerilenSureMaxGun!=='')){
    if(isNaN(sure)){
      checks.push({label:'Süre kontrolü', status:'NA', detail:'Reçetede kullanım süresi okunamadı/girilmedi', kuralAdi:rule.kuralAdi});
    } else {
      const min = rule.izinVerilenSureMinGun!==''? Number(rule.izinVerilenSureMinGun): null;
      const max = rule.izinVerilenSureMaxGun!==''? Number(rule.izinVerilenSureMaxGun): null;
      const withinMin = min==null || sure>=min;
      const withinMax = max==null || sure<=max;
      checks.push({label:'Süre kontrolü', status:(withinMin&&withinMax)?'OK':'BAD',
        detail:`Reçete: ${sure} gün / İzin verilen: ${min??'—'}–${max??'—'} gün`, kuralAdi:rule.kuralAdi,
        recValue:sure, sudValue:`${min??'—'}-${max??'—'}`, param:'kullanimSuresi'});
    }
  } else {
    checks.push({label:'Süre kontrolü', status:'NA', detail:'Bu kural için süre sınırı tanımlanmamış', kuralAdi:rule.kuralAdi});
  }
  // Günlük doz kontrolü
  if(rule.izinVerilenGunlukDoz!=null && rule.izinVerilenGunlukDoz!==''){
    if(isNaN(gunlukDoz)){
      checks.push({label:'Günlük doz kontrolü', status:'NA', detail:'Günlük doz hesaplanamadı (doz/kullanım sıklığı eksik veya belirsiz)', kuralAdi:rule.kuralAdi});
    } else {
      const limit = Number(rule.izinVerilenGunlukDoz);
      checks.push({label:'Günlük doz kontrolü', status: gunlukDoz<=limit?'OK':'BAD',
        detail:`Reçete: ${gunlukDoz} / İzin verilen üst sınır: ${limit}`, kuralAdi:rule.kuralAdi,
        recValue:gunlukDoz, sudValue:limit, param:'gunlukDoz'});
    }
  } else {
    checks.push({label:'Günlük doz kontrolü', status:'NA', detail:'Bu kural için günlük doz sınırı tanımlanmamış', kuralAdi:rule.kuralAdi});
  }
  // Özel şart
  if(rule.ozelSart){
    checks.push({label:'Özel şart', status:'WARN', detail:rule.ozelSart+' — otomatik doğrulanamaz, manuel değerlendirme gereklidir.', kuralAdi:rule.kuralAdi});
  }
  // kontrolParametresi tanımlı ama yukarıdaki üç standart parametre dışında ise otomatik değerlendirilemez
  if(rule.kontrolParametresi && !['kutuSayisi','kullanimSuresi','gunlukDoz'].includes(rule.kontrolParametresi)){
    checks.push({label:'Özel parametre: '+rule.kontrolParametresi, status:'WARN',
      detail:'Bu parametre için otomatik kontrol mantığı tanımlı değildir; manuel değerlendirme gereklidir.', kuralAdi:rule.kuralAdi});
  }
  return checks;
}
function worstStatus(list){
  for(const s of STATUS_PRIORITY) if(list.includes(s)) return s;
  return 'NA';
}
async function runControl(draft){
  const ilacSonuclari = [];
  for(const ilac of draft.ilaclar){
    if(!ilac.ilacAdi){ continue; }
    const medMatch = findMedicationMatch(ilac);
    let checks = [];
    let status;
    if(!medMatch){
      status = 'NA';
      checks = [{label:'İlaç eşleşmesi', status:'NA', detail:'İlaç veritabanında eşleşme bulunamadı — kontrol yapılamıyor.'}];
    } else {
      const rules = findApplicableRules(medMatch, ilac, draft.recete.tarih);
      if(rules.length===0){
        status = 'NA';
        checks = [
          {label:'İlaç eşleşmesi', status:'OK', detail:medMatch.ilacAdi},
          {label:'SUD kural eşleşmesi', status:'NA', detail:'Bu ilaç/etken madde için (reçete tarihinde geçerli) tanımlı bir SUD kuralı bulunamadı.'},
        ];
      } else {
        let allChecks = [];
        rules.forEach(r=>{ allChecks = allChecks.concat(evalRuleForIlac(r, ilac, medMatch)); });
        checks = allChecks;
      }
      status = worstStatus(checks.map(c=>c.status));
    }
    ilacSonuclari.push({
      ilacId: ilac.id, ilacAdi: ilac.ilacAdi, etkenMadde: ilac.etkenMadde, doz: ilac.doz,
      kullanimSikligi: ilac.kullanimSikligi, kutuAdedi: ilac.kutuAdedi, kullanimSuresiGun: ilac.kullanimSuresiGun,
      medMatchId: medMatch? medMatch.id : null,
      status, checks,
    });
  }
  const counts = {toplam:ilacSonuclari.length, uygun:0, uyari:0, uygunsuz:0, kontrolEdilemedi:0};
  ilacSonuclari.forEach(r=>{
    if(r.status==='OK') counts.uygun++;
    else if(r.status==='WARN') counts.uyari++;
    else if(r.status==='BAD') counts.uygunsuz++;
    else counts.kontrolEdilemedi++;
  });
  const genelSonuc = worstStatus(ilacSonuclari.map(r=>r.status));
  return {
    ilacSonuclari, counts, genelSonuc,
    kontrolTarihi: nowIso(),
    kontrolEden: (App.settings.kontrolEden)||'—',
    ruleSetValidatedAtControl: App.settings.sudRulesValidated && !App.settings.sudRulesChangedSinceValidation,
  };
}

function drawAnnotations(){
  const d = App.draft;
  const img = document.getElementById('annotImg');
  const wrap = document.getElementById('annotWrap');
  if(!img || !d.ocrWords || !d.ocrWords.length) return;
  const draw = ()=>{
    wrap.querySelectorAll('.annot-box').forEach(b=>b.remove());
    const scaleX = img.clientWidth / img.naturalWidth;
    const scaleY = img.clientHeight / img.naturalHeight;
    d.sonuclar.ilacSonuclari.forEach((r,idx)=>{
      const nameTok = normTr(r.ilacAdi).split(' ')[0];
      if(!nameTok) return;
      const w = d.ocrWords.find(w=> normTr(w.text).includes(nameTok) || nameTok.includes(normTr(w.text)));
      if(!w || !w.bbox) return;
      const color = r.status==='OK'?'#16a34a':r.status==='WARN'?'#eab308':r.status==='BAD'?'#dc2626':'#94a3b8';
      const box = document.createElement('div');
      box.className='annot-box';
      box.style.cssText = `position:absolute;border:2px solid ${color};background:${color}22;cursor:pointer;
        left:${w.bbox.x0*scaleX}px;top:${w.bbox.y0*scaleY}px;width:${(w.bbox.x1-w.bbox.x0)*scaleX}px;height:${(w.bbox.y1-w.bbox.y0)*scaleY}px;`;
      box.title = r.ilacAdi+' — '+STATUS[r.status].label;
      box.onclick = ()=>{ document.getElementById('medcard-'+idx).scrollIntoView({behavior:'smooth',block:'center'}); };
      wrap.appendChild(box);
    });
  };
  if(img.complete) draw(); else img.onload = draw;
}

function normKey(s){ return normTr(s).replace(/\s+/g,''); }
function pickField(row, aliases){
  if(!row.__normMap){
    row.__normMap = {};
    Object.keys(row).forEach(k=>{ if(k!=='__normMap') row.__normMap[normKey(k)] = row[k]; });
  }
  for(const a of aliases){
    const v = row.__normMap[normKey(a)];
    if(v!==undefined && v!==null && String(v).trim()!=='') return v;
  }
  return '';
}
async function importRulesFile(file){
  if(!file) return;
  try{
    let rows;
    if(file.name.endsWith('.json')){
      rows = JSON.parse(await file.text());
    } else {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    }
    let count=0, skipped=0;
    for(const r of rows){
      const kuralAdi = pickField(r,['kuralAdi','KuralAdi','Kural Adı','Kural ID','Kural adı']);
      const ilacAdi = pickField(r,['ilacAdi','İlaç','İlaç Adı','ilac']);
      if(!kuralAdi || !ilacAdi){ skipped++; continue; }
      const aktifRaw = pickField(r,['aktif','Aktif (EVET/HAYIR)','Aktif/Pasif','Aktif']);
      const rule = {
        id: uuid(), groupId: pickField(r,['groupId'])||uuid(), version: Number(pickField(r,['version']))||1,
        kuralAdi, aciklama: pickField(r,['aciklama','Açıklama','Kural açıklaması','Kural Açıklaması']),
        ilacAdi, etkenMadde: pickField(r,['etkenMadde','Etken Madde']), atcKodu: pickField(r,['atcKodu','ATC Kodu','ATC']),
        kontrolParametresi: pickField(r,['kontrolParametresi','Kontrol Parametresi (kutuSayisi/kullanimSuresi/gunlukDoz/diger)','Kontrol Parametresi'])||'diger',
        minDeger: pickField(r,['minDeger','Minimum Değer','Minimum değer']), maxDeger: pickField(r,['maxDeger','Maksimum Değer','Maksimum değer']),
        izinVerilenKutuSayisi: pickField(r,['izinVerilenKutuSayisi','İzin Verilen Kutu Sayısı']),
        izinVerilenSureMinGun: pickField(r,['izinVerilenSureMinGun','İzin Verilen Süre Min (gün)','İzin Verilen Kullanım Süresi Min']),
        izinVerilenSureMaxGun: pickField(r,['izinVerilenSureMaxGun','İzin Verilen Süre Maks (gün)','İzin Verilen Kullanım Süresi Maks']),
        izinVerilenGunlukDoz: pickField(r,['izinVerilenGunlukDoz','İzin Verilen Günlük Doz']),
        ozelSart: pickField(r,['ozelSart','Özel Şart']), uyariSeviyesi: pickField(r,['uyariSeviyesi','Uyarı Seviyesi (bilgi/uyari/kritik)','Uyarı Seviyesi'])||'uyari',
        kaynak: pickField(r,['kaynak','Kaynak'])||'İçe aktarıldı',
        gecerlilikBaslangic: pickField(r,['gecerlilikBaslangic','Geçerlilik Başlangıç (YYYY-AA-GG)','Geçerlilik Başlangıç Tarihi','Geçerlilik başlangıç tarihi']),
        gecerlilikBitis: pickField(r,['gecerlilikBitis','Geçerlilik Bitiş (YYYY-AA-GG, boş=süresiz)','Geçerlilik Bitiş Tarihi','Geçerlilik bitiş tarihi']),
        aktif: !(String(aktifRaw).trim().toLowerCase()==='hayır' || String(aktifRaw).trim().toLowerCase()==='hayir' || aktifRaw===false || aktifRaw==='false'),
        isDemo:false, createdAt:nowIso(), updatedAt:nowIso(),
      };
      await dbPut('sudRules', rule);
      count++;
    }
    await markRulesChanged();
    toast(count+' kural içe aktarıldı'+(skipped?`, ${skipped} satır (kural/ilaç adı eksik) atlandı`:'')+'. Kullanmadan önce lütfen doğrulayın.','ok');
    route();
  }catch(err){
    console.error(err); toast('İçe aktarma hatası: '+err.message,'err');
  }
}

    soyad: opts.mask? maskName(p.hasta.soyad) : p.hasta.soyad,
    tckn: opts.mask? maskTckn(p.hasta.tckn) : p.hasta.tckn,
    dogumTarihi: p.hasta.dogumTarihi, cinsiyet: p.hasta.cinsiyet,
  };
  const violations = [];
  (p.sonuclar?.ilacSonuclari||[]).forEach(r=>{
    (r.checks||[]).filter(c=>c.status==='BAD').forEach(c=>{
      violations.push({ilac:r.ilacAdi, etkenMadde:r.etkenMadde, kuralAdi:c.kuralAdi, receteDeger:c.recValue, sudKriteri:c.sudValue, aciklama:c.detail});
    });
  });
  return {
    raporNo: 'RPR-'+p.id.slice(0,8).toUpperCase(),
    olusturmaTarihi: nowIso(),
    kurumAdi: App.settings.kurumAdi||'—',
    receteNo: p.recete.no, receteTarihi: p.recete.tarih, hasta, doktor: p.recete.doktorAdi,
    doktorBransi: p.recete.doktorBranş, kurum: p.recete.kurum, kontrolTarihi: p.sonuclar?.kontrolTarihi,
    kontrolEden: p.controlledBy||p.sonuclar?.kontrolEden||'—',
    ilaclar: p.sonuclar?.ilacSonuclari||[], violations,
    genelSonuc: p.sonuclar?.genelSonuc, counts: p.sonuclar?.counts,
    ruleSetValidated: p.sonuclar?.ruleSetValidatedAtControl,
  };
}

async function exportReportPdf(m){
  toast('PDF oluşturuluyor…');
  const el = document.getElementById('printReport');
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF('p','pt','a4');
  const pageW = doc.internal.pageSize.getWidth();
  await doc.html(el, {
    x:24, y:24, width: pageW-48, windowWidth: el.scrollWidth,
    html2canvas:{scale:2, useCORS:true},
    autoPaging:'text',
    callback: (doc)=>{
      const pageCount = doc.internal.getNumberOfPages();
      for(let i=1;i<=pageCount;i++){
        doc.setPage(i);
        doc.setFontSize(8); doc.setTextColor(120);
        doc.text(`Rapor No: ${m.raporNo}  ·  Reçete No: ${m.receteNo||'—'}  ·  Sayfa ${i}/${pageCount}`, 24, doc.internal.pageSize.getHeight()-16);
      }
      doc.save(`SUD_Rapor_${m.raporNo}.pdf`);
      toast('PDF indirildi.','ok');
    }
  });
}
async function exportReportWord(m){
  const { Document, Packer, Paragraph, Table, TableRow, TableCell, HeadingLevel, TextRun, WidthType } = docx;
  const mkTable = (headers, rows)=> new Table({
    width:{size:100, type:WidthType.PERCENTAGE},
    rows:[
      new TableRow({children: headers.map(h=> new TableCell({children:[new Paragraph({children:[new TextRun({text:h, bold:true})]})]}))}),
      ...rows.map(r=> new TableRow({children: r.map(c=> new TableCell({children:[new Paragraph(String(c??'—'))]}))}))
    ]
  });
  const children = [
    new Paragraph({text: m.kurumAdi||'Eczane', heading:HeadingLevel.TITLE}),
    new Paragraph({text: `Reçete SUD Ön Kontrol Raporu — ${m.raporNo}`}),
    new Paragraph({text: `Tarih: ${fmtDateTime(m.olusturmaTarihi)}    Reçete No: ${m.receteNo||'—'}`}),
    new Paragraph({text:''}),
    new Paragraph({text:'Reçete Bilgileri', heading:HeadingLevel.HEADING_1}),
    mkTable(['Alan','Değer'], [
      ['Reçete No', m.receteNo], ['Reçete Tarihi', fmtDate(m.receteTarihi)],
      ['Hasta', m.hasta? ((m.hasta.ad||'')+' '+(m.hasta.soyad||'')) : 'Rapordan çıkarıldı'],
      ['T.C. Kimlik No', m.hasta? m.hasta.tckn : '—'],
      ['Doktor', m.doktor], ['Kurum', m.kurum],
      ['Kontrol Tarihi', fmtDateTime(m.kontrolTarihi)], ['Kontrol Eden', m.kontrolEden],
    ]),
    new Paragraph({text:''}),
    new Paragraph({text:'İlaçlar', heading:HeadingLevel.HEADING_1}),
    mkTable(['İlaç','Etken Madde','Doz','Kullanım','Kutu','Süre','Sonuç'],
      m.ilaclar.map(r=>[r.ilacAdi, r.etkenMadde, r.doz, r.kullanimSikligi, r.kutuAdedi, r.kullanimSuresiGun, STATUS[r.status].label])),
    new Paragraph({text:''}),
    new Paragraph({text:'Uygunsuzluklar', heading:HeadingLevel.HEADING_1}),
    m.violations.length? mkTable(['İlaç','Kural','Reçete Değeri','SUD Kriteri','Açıklama'],
      m.violations.map(v=>[v.ilac, v.kuralAdi, v.receteDeger, v.sudKriteri, v.aciklama]))
      : new Paragraph('Tespit edilen uygunsuzluk yok.'),
    new Paragraph({text:''}),
    new Paragraph({text:'Genel Sonuç', heading:HeadingLevel.HEADING_1}),
    new Paragraph({text: (m.genelSonuc==='OK'?'UYGUN':'KONTROL GEREKLİ') + ` — Toplam ${m.counts?.toplam||0} ilaç: ${m.counts?.uygun||0} uygun, ${m.counts?.uyari||0} uyarı, ${m.counts?.uygunsuz||0} uygunsuz, ${m.counts?.kontrolEdilemedi||0} kontrol edilemedi.`}),
    new Paragraph({text:'Bu rapor yalnızca tanımlanmış SUD kurallarına göre otomatik ön kontrol sonucudur; tıbbi karar veya kesin geri ödeme kararı yerine geçmez.'}),
  ];
  const doc = new Document({sections:[{children}]});
  const blob = await Packer.toBlob(doc);
  downloadBlob(blob, `SUD_Rapor_${m.raporNo}.docx`);
  toast('Word raporu indirildi.','ok');
}
function exportReportExcel(m){
  const wb = XLSX.utils.book_new();
  const infoWs = XLSX.utils.json_to_sheet([
    {Alan:'Rapor No', Değer:m.raporNo}, {Alan:'Reçete No', Değer:m.receteNo}, {Alan:'Reçete Tarihi', Değer:fmtDate(m.receteTarihi)},

  ]);

  const medWs = XLSX.utils.json_to_sheet(m.ilaclar.map(r=>({İlaç:r.ilacAdi, EtkenMadde:r.etkenMadde, Doz:r.doz, Kullanim:r.kullanimSikligi, Kutu:r.kutuAdedi, Sure:r.kullanimSuresiGun, Sonuc:STATUS[r.status].label})));
  XLSX.utils.book_append_sheet(wb, medWs, 'İlaçlar');
  const vWs = XLSX.utils.json_to_sheet(m.violations.map(v=>({İlaç:v.ilac, Kural:v.kuralAdi, ReceteDegeri:v.receteDeger, SudKriteri:v.sudKriteri, Aciklama:v.aciklama})));

async function viewArchive(content){
  const prescriptions = (await dbGetAll('prescriptions')).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  content.innerHTML = `
    <div class="card flex wrap">
      <input type="text" id="aSearch" placeholder="Reçete no / hasta / doktor / ilaç ara…" style="max-width:280px">
      <select id="aFilter">
        <option value="">Tüm Sonuçlar</option>
        <option value="OK">🟢 UYGUN</option>
        <option value="WARN">🟡 UYARI</option>
        <option value="BAD">🔴 UYGUNSUZ</option>
        <option value="NA">⚪ KONTROL EDİLEMEDİ</option>
      </select>
      <input type="date" id="aDate">
      <span class="spacer"></span>
      <span class="small">${prescriptions.length} kayıt</span>
    </div>
    <div id="archiveList"></div>
  `;
  function statusOfPrescription(p){
    const s = p.sonuclar?.ilacSonuclari||[];
    if(s.some(r=>r.status==='BAD')) return 'BAD';
    if(s.some(r=>r.status==='WARN')) return 'WARN';
    if(s.some(r=>r.status==='NA')) return 'NA';
    return 'OK';
  }
  function render(){
    const q = normTr(document.getElementById('aSearch').value);
    const filt = document.getElementById('aFilter').value;
    const date = document.getElementById('aDate').value;
    const rows = prescriptions.filter(p=>{
      if(filt && statusOfPrescription(p)!==filt) return false;
      if(date && (p.recete.tarih||'').slice(0,10)!==date) return false;
      if(q){
        const hay = normTr([p.recete.no, p.hasta.ad, p.hasta.soyad, p.recete.doktorAdi, ...(p.sonuclar?.ilacSonuclari||[]).map(r=>r.ilacAdi)].join(' '));
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    document.getElementById('archiveList').innerHTML = rows.map(p=>{
      const st = STATUS[statusOfPrescription(p)];
      return `<div class="card" style="margin-bottom:10px">
        <div class="flex wrap" style="justify-content:space-between">
          <div>
            <b>${escapeHtml(p.recete.no||'(reçete no yok)')}</b> — ${escapeHtml(p.hasta.ad||'')} ${escapeHtml(p.hasta.soyad||'')}
            <div class="small">Doktor: ${escapeHtml(p.recete.doktorAdi||'—')} · Tarih: ${fmtDate(p.recete.tarih)} · Kontrol: ${fmtDateTime(p.controlledAt)}</div>
          </div>
          <div class="flex">
            <span class="badge ${st.cls}">${st.icon} ${st.label}</span>
            <button class="btn sm" onclick="openArchiveItem('${p.id}')">Görüntüle</button>
            <button class="btn sm danger" onclick="deleteArchiveItem('${p.id}')">Sil</button>
          </div>
        </div>
      </div>`;
    }).join('') || '<div class="card small center">Kayıt bulunamadı.</div>';
  }
  document.getElementById('aSearch').oninput = render;
  document.getElementById('aFilter').onchange = render;
  document.getElementById('aDate').onchange = render;
  render();
}
window.openArchiveItem = async function(id){
  const p = await dbGet('prescriptions', id);
  if(!p){ toast('Kayıt bulunamadı.','err'); return; }
  let imgUrl = null;
  if(p.imageId){
    const img = await dbGet('images', p.imageId);
    if(img) imgUrl = await blobToDataUrl(img.blob);
  }
  App.draft = {
    id:p.id, step:4, imageDataUrl:imgUrl, editedDataUrl:imgUrl, imageMeta:{},
    ocrRawText:'', ocrConfidence:p.ocrConfidence, ocrWords:[],
    manualFields:new Set(p.manualFields||[]),
    hasta:p.hasta, recete:p.recete, ilaclar:p.ilaclar,
    sonuclar:p.sonuclar, controlledAt:p.controlledAt, savedToArchive:true,
  };
  location.hash='#control'; route();
};
window.deleteArchiveItem = function(id){
  confirmDialog('Bu reçete kaydı arşivden kalıcı olarak silinsin mi?', async ()=>{
    const p = await dbGet('prescriptions', id);
    if(p && p.imageId) await dbDelete('images', p.imageId);
    await dbDelete('prescriptions', id);
    toast('Silindi.'); route();
  }, {danger:true});
};

      <p class="small">Bu işlem mevcut verilerin üzerine EKLEME yapar (var olan kayıtlar korunur, aynı ID'ler güncellenir). Devam etmeden önce mevcut verilerinizi de yedeklemeniz önerilir.</p>
      <input type="file" id="restoreFile" accept=".json">

    restoreBackup(f);

  document.getElementById('wipeBtn').onclick = ()=>{
    confirmDialog('TÜM veriler (reçeteler, ilaçlar, kurallar, ayarlar) kalıcı olarak silinecek. Emin misiniz?', async ()=>{
      for(const s of STORES) await dbClear(s);
      App.settings = null;
      toast('Tüm veriler sıfırlandı. Sayfa yeniden yükleniyor…');
      setTimeout(()=>location.reload(), 1200);
    }, {danger:true, yesLabel:'Evet, Sıfırla'});
  };
}
async function fullBackup(){
  toast('Yedek hazırlanıyor…');
  const [prescriptions, medications, sudRules, images] = await Promise.all([
    dbGetAll('prescriptions'), dbGetAll('medications'), dbGetAll('sudRules'), dbGetAll('images')
  ]);
  const imagesB64 = [];
  for(const im of images){
    imagesB64.push({id:im.id, createdAt:im.createdAt, dataUrl: await blobToDataUrl(im.blob)});
  }
  const payload = {
    __app:'eczane-sud-kontrol', __version:1, exportedAt: nowIso(),
    settings: App.settings, prescriptions, medications, sudRules, images: imagesB64,
  };
  exportJsonFile(payload, `eczane_sud_yedek_${new Date().toISOString().slice(0,10)}.json`);
  toast('Yedek indirildi.','ok');
}
async function restoreBackup(file){
  try{
    const payload = JSON.parse(await file.text());
    if(payload.__app!=='eczane-sud-kontrol') throw new Error('Geçersiz yedek dosyası formatı.');
    for(const m of payload.medications||[]) await dbPut('medications', m);
    for(const r of payload.sudRules||[]) await dbPut('sudRules', r);
    for(const im of payload.images||[]){ const blob = await dataUrlToBlob(im.dataUrl); await dbPut('images', {id:im.id, blob, createdAt:im.createdAt}); }
    for(const p of payload.prescriptions||[]) await dbPut('prescriptions', p);
    if(payload.settings) await saveSettings({...defaultSettings(), ...payload.settings});
    toast('Geri yükleme tamamlandı.','ok');
    App.settings = await getSettings();
    App.medications = await dbGetAll('medications');
    App.sudRules = await dbGetAll('sudRules');
    route();
  }catch(err){
    console.error(err); toast('Geri yükleme hatası: '+err.message,'err');
  }
}
